[package]
name = "rust-web-app-template"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish = false

[workspace]
members = ["crates/api", "crates/kernel", "crates/adapter", "crates/registry", "crates/shared"]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.98"

[workspace.dependencies]
anyhow = "1"
async-trait = "0.1"
axum = "0.8.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "tls-rustls-ring", "postgres", "migrate", "macros"] }
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["cors", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
api = { path = "crates/api" }
kernel = { path = "crates/kernel" }
adapter = { path = "crates/adapter" }
registry = { path = "crates/registry" }
shared = { path = "crates/shared" }

[dependencies]
anyhow.workspace = true
axum.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
api.workspace = true
registry.workspace = true
shared.workspace = true
